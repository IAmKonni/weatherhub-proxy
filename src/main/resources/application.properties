# HTTP
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# Upstream portal (can be overridden via WEATHERHUB_BASE_URL / WEATHERHUB_TIMEOUT)
weatherhub.base-url=https://measurements.mobile-alerts.eu/
weatherhub.timeout=PT15S

# Native image needs TLS for the HTTPS calls to the portal
quarkus.ssl.native=true

# Logging (set QUARKUS_LOG_CATEGORY__ROCKS_KONRATH__LEVEL=DEBUG for request/parser details)
quarkus.log.category."rocks.konrath".level=INFO
