name: Maven and Docker build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build native Quarkus application
        run: ./mvnw -B package -Pnative -DskipTests

      - name: Validate Docker image build
        if: github.event_name == 'pull_request'
        run: docker build -f src/main/docker/Dockerfile.native-distroless -t weatherhub-proxy:pr-${{ github.sha }} .

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && secrets.DOCKER_USER != '' && secrets.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image to Docker Hub
        if: github.event_name == 'push' && secrets.DOCKER_USER != '' && secrets.DOCKER_PASSWORD != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.native-distroless
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/weatherhub-proxy:latest
            ${{ secrets.DOCKER_USER }}/weatherhub-proxy:${{ github.sha }}
