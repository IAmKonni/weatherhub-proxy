name: Maven and Docker build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up GraalVM native-image
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17.0.12'
          distribution: 'graalvm'
          components: 'native-image'

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build native Quarkus application
        run: ./mvnw -B package -Pnative -DskipTests

      - name: Validate Docker image build
        if: github.event_name == 'pull_request'
        run: docker build -f src/main/docker/Dockerfile.native-distroless -t weatherhub-proxy:pr-${{ github.sha }} .

      - name: Log in to Docker Hub
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v3

      - name: Build and push Docker image to Docker Hub
        if: ${{ github.event_name == 'push' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.native-distroless
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/weatherhub-proxy:latest
            ${{ secrets.DOCKER_USER }}/weatherhub-proxy:${{ github.sha }}
