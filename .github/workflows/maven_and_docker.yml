name: Maven and Docker build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: weatherhub-proxy

jobs:
  test:
    name: Test (JVM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B verify

      - name: Validate JVM Docker image
        run: docker build -f src/main/docker/Dockerfile.jvm -t ${{ env.IMAGE_NAME }}:jvm-check .

  native:
    name: Native build and Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Builds the native executable inside the Mandrel builder container,
      # so no GraalVM installation is needed on the runner.
      - name: Build native executable
        run: ./mvnw -B package -Dnative -DskipTests -Dquarkus.native.container-build=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build (and on master push) Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/main/docker/Dockerfile.native-distroless
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_USER || 'local' }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USER || 'local' }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
